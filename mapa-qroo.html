<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa · Quintana Roo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:#F3F1EA;font-family:'Schibsted Grotesk',system-ui,sans-serif;font-variant-numeric:tabular-nums;}
  #map{position:absolute;inset:0;background:#F3F1EA;}
  .leaflet-container{background:#F3F1EA;font-family:'Schibsted Grotesk',system-ui,sans-serif;}
  .leaflet-tile-pane{filter:saturate(.28) brightness(1.1) contrast(.9);}
  .leaflet-control-attribution{background:rgba(255,255,255,.72)!important;font-size:9.5px!important;color:#8A7B66!important;padding:2px 7px!important;border-radius:8px 0 0 0;}
  .leaflet-control-attribution a{color:#9F2241!important;}
  .leaflet-control-zoom{border:none!important;box-shadow:0 10px 26px -16px rgba(20,16,8,.5)!important;}
  .leaflet-control-zoom a{background:rgba(255,255,255,.9)!important;color:#5E6168!important;border-color:rgba(11,11,12,.06)!important;backdrop-filter:blur(10px);font-weight:600;}
  .leaflet-control-zoom a:hover{background:#fff!important;color:#0A0A0A!important;}
  .oq-bubble{cursor:pointer;transition:filter .2s ease;}
  .oq-bubble:hover{filter:brightness(1.08);}
  .oq-tag{background:rgba(255,255,255,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(11,11,12,.07);border-radius:999px;padding:3px 9px;font-size:11px;font-weight:600;color:#1A1A1C;white-space:nowrap;box-shadow:0 8px 20px -14px rgba(20,16,8,.5);}
  .leaflet-tooltip.oq-tip{background:#FFFFFF;border:1px solid rgba(11,11,12,.08);border-radius:14px;box-shadow:0 18px 44px -22px rgba(20,16,8,.45);padding:12px 15px;font-size:12.5px;color:#5E6168;}
  .leaflet-tooltip.oq-tip::before{display:none;}
  .oq-tip b{display:block;font-size:14.5px;font-weight:600;color:#0A0A0A;margin-bottom:5px;letter-spacing:-.01em;}
  .oq-tip .n{font-size:19px;font-weight:600;color:#9F2241;letter-spacing:-.02em;}
  #panel{position:absolute;left:14px;top:14px;z-index:600;display:flex;flex-direction:column;gap:7px;background:rgba(255,255,255,.72);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,.9);border-radius:15px;padding:13px 15px;box-shadow:0 20px 50px -32px rgba(20,16,8,.5);}
  #panel .t{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8A7B66;}
  #panel .r{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#5E6168;}
  #panel .d{border-radius:999px;background:rgba(159,34,65,.55);border:1px solid rgba(159,34,65,.9);flex:none;}
  #metric{position:absolute;right:14px;top:14px;z-index:600;display:flex;gap:3px;background:rgba(255,255,255,.72);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,.9);border-radius:13px;padding:4px;box-shadow:0 20px 50px -32px rgba(20,16,8,.5);}
  #metric button{border:none;background:transparent;font-family:inherit;font-size:11.5px;font-weight:600;color:#8A8C93;padding:7px 13px;border-radius:9px;cursor:pointer;transition:all .2s ease;}
  #metric button.on{background:#FFFFFF;color:#0A0A0A;box-shadow:0 4px 12px -8px rgba(20,16,8,.5);}
  /* En mapas angostos la leyenda baja para no chocar con el selector de métrica */
  @media (max-width:560px){
    #panel{top:auto;bottom:24px;left:10px;padding:10px 12px;}
    #metric{top:10px;right:10px;}
    #metric button{font-size:11px;padding:6px 10px;}
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="metric">
  <button data-m="ue" class="on">Unidades económicas</button>
  <button data-m="emp">Empleo</button>
</div>
<div id="panel">
  <span class="t">Escala</span>
  <span class="r"><span class="d" style="width:7px;height:7px;"></span>Menos de 5 mil</span>
  <span class="r"><span class="d" style="width:13px;height:13px;"></span>5 – 20 mil</span>
  <span class="r"><span class="d" style="width:21px;height:21px;"></span>Más de 20 mil</span>
</div>
<script>
  var MUN = [
    { n:'Benito Juárez',          c:'Cancún',            lat:21.1610, lng:-86.8510, ue:48120, emp:412300, pib:38.4 },
    { n:'Othón P. Blanco',        c:'Chetumal',          lat:18.5040, lng:-88.2960, ue:17640, emp:118400, pib:11.2 },
    { n:'Solidaridad',            c:'Playa del Carmen',  lat:20.6290, lng:-87.0740, ue:16980, emp:172600, pib:18.7 },
    { n:'Felipe Carrillo Puerto', c:'Carrillo Puerto',   lat:19.5780, lng:-88.0450, ue:5310,  emp:28900,  pib:2.1 },
    { n:'Cozumel',                c:'San Miguel',        lat:20.5110, lng:-86.9490, ue:5140,  emp:44800,  pib:5.3 },
    { n:'Tulum',                  c:'Tulum',             lat:20.2120, lng:-87.4660, ue:4720,  emp:52100,  pib:6.8 },
    { n:'José María Morelos',     c:'J. M. Morelos',     lat:19.7480, lng:-88.7050, ue:3180,  emp:16700,  pib:1.2 },
    { n:'Bacalar',                c:'Bacalar',           lat:18.6780, lng:-88.3950, ue:2460,  emp:14300,  pib:1.4 },
    { n:'Lázaro Cárdenas',        c:'Kantunilkín',       lat:21.0980, lng:-87.4870, ue:1890,  emp:11200,  pib:0.9 },
    { n:'Isla Mujeres',           c:'Isla Mujeres',      lat:21.2320, lng:-86.7310, ue:1640,  emp:18600,  pib:2.3 },
    { n:'Puerto Morelos',         c:'Puerto Morelos',    lat:20.8480, lng:-86.8760, ue:1520,  emp:23900,  pib:2.8 }
  ];

  var map = L.map('map', {
    center: [19.75, -87.85], zoom: 7, zoomControl: false,
    scrollWheelZoom: false, attributionControl: true
  });
  // El zoom va abajo a la derecha: arriba a la izquierda tapaba la leyenda de escala.
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors', maxZoom: 14
  }).addTo(map);

  var metric = 'ue';
  var layer = L.layerGroup().addTo(map);
  var labels = L.layerGroup().addTo(map);
  var selected = null;

  function fmt(n) { return n.toLocaleString('es-MX'); }
  function radius(m) {
    var v = m === 'ue' ? MUN.map(function(x){return x.ue;}) : MUN.map(function(x){return x.emp;});
    var max = Math.max.apply(null, v);
    return function (val) { return 9 + Math.sqrt(val / max) * 27; };
  }

  function draw() {
    layer.clearLayers(); labels.clearLayers();
    var r = radius(metric);
    MUN.forEach(function (m) {
      var val = metric === 'ue' ? m.ue : m.emp;
      var rad = r(val);
      var sel = selected === m.n;
      var circ = L.circleMarker([m.lat, m.lng], {
        radius: rad,
        className: 'oq-bubble',
        color: sel ? '#7A1B33' : '#9F2241',
        weight: sel ? 2.6 : 1.4,
        opacity: sel ? 1 : .85,
        fillColor: sel ? '#9F2241' : '#B23B58',
        fillOpacity: sel ? .5 : .26
      }).addTo(layer);

      circ.bindTooltip(
        '<b>' + m.n + '</b>' +
        '<span class="n">' + fmt(val) + '</span> ' +
        (metric === 'ue' ? 'unidades económicas' : 'personas ocupadas') +
        '<br>' + m.pib.toFixed(1) + '% del PIB estatal · ' + m.c,
        { className: 'oq-tip', direction: 'top', offset: [0, -rad - 4], sticky: false }
      );

      circ.on('click', function () {
        selected = selected === m.n ? null : m.n;
        draw();
        try {
          parent.postMessage({ type: 'oq-municipio', municipio: selected, data: selected ? m : null }, '*');
        } catch (e) {}
      });

      if (val > 4000) {
        L.marker([m.lat, m.lng], {
          icon: L.divIcon({
            className: '', html: '<span class="oq-tag">' + m.n + '</span>',
            iconSize: null, iconAnchor: [-rad - 2, 8]
          }), interactive: false
        }).addTo(labels);
      }
    });
  }

  draw();

  document.querySelectorAll('#metric button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('#metric button').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      metric = b.dataset.m;
      draw();
    });
  });

  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'oq-select') {
      selected = e.data.municipio || null;
      draw();
      var m = MUN.filter(function (x) { return x.n === selected; })[0];
      if (m) map.setView([m.lat, m.lng], 9, { animate: true });
    }
    if (e.data && e.data.type === 'oq-reset') { selected = null; draw(); map.setView([19.75, -87.85], 7, { animate: true }); }
  });
</script>
</body>
</html>
