# ============================================================================
#  Stack del Observatorio Económico — para desplegar en el VPS de Hostinger
#  del SATQ (187.77.13.82) vía Portainer.
#
#  Se cuelga del Traefik que YA existe (el del stack de n8n) para obtener
#  HTTPS automático. NO publica puertos al host y NO instala ningún proxy
#  nuevo: todo el tráfico entra por Traefik. Mismo molde que satq-wizard.
#
#  Este stack NO tiene secretos: el sitio es 100% estático y público. No hay
#  Environment variables que capturar en Portainer.
# ============================================================================
services:
  observatorio:
    build:
      context: .
      dockerfile: Dockerfile
    image: observatorio-web:latest
    container_name: observatorio-web
    restart: unless-stopped

    # Sitio estático sin estado: si el contenedor muere no se pierde nada.
    healthcheck:
      # 127.0.0.1 explícito, NO "localhost": dentro del contenedor localhost
      # resuelve primero a ::1 (IPv6) y nginx solo escucha en IPv4 → el
      # healthcheck se rechazaría a sí mismo y el stack saldría "unhealthy".
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    networks:
      - n8n_default

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      # Router: subdominio propio, mismos entrypoints y certresolver que n8n.
      # El DNS ya resuelve por el wildcard *.srv1682335.hstgr.cloud.
      - "traefik.http.routers.observatorio.rule=Host(`observatorio.srv1682335.hstgr.cloud`)"
      - "traefik.http.routers.observatorio.entrypoints=web,websecure"
      - "traefik.http.routers.observatorio.tls=true"
      - "traefik.http.routers.observatorio.tls.certresolver=mytlschallenge"
      # A qué puerto interno habla Traefik (nginx).
      - "traefik.http.services.observatorio.loadbalancer.server.port=80"
      # Cabeceras de seguridad (mismo estilo que el router del wizard).
      - "traefik.http.routers.observatorio.middlewares=observatorio@docker"
      - "traefik.http.middlewares.observatorio.headers.sslRedirect=true"
      - "traefik.http.middlewares.observatorio.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.observatorio.headers.stsSeconds=315360000"
      - "traefik.http.middlewares.observatorio.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.observatorio.headers.stsPreload=true"
      - "traefik.http.middlewares.observatorio.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.observatorio.headers.browserXssFilter=true"

# La red la creó el stack de n8n; aquí solo nos conectamos a ella.
networks:
  n8n_default:
    external: true
