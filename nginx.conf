# ============================================================================
#  Server block del Observatorio. Sitio estático de 2 páginas + assets.
#
#  Las cabeceras de seguridad (HSTS, nosniff, redirección a HTTPS) las pone
#  Traefik en el borde — ver los labels del docker-compose.yml. Aquí solo va
#  lo que le toca al origen: compresión, cache y el manejo de rutas.
# ============================================================================
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Compresión ---------------------------------------------------------
    # index.html pesa ~81 KB en texto; comprimido baja a una fracción.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml;

    # --- Rutas --------------------------------------------------------------
    # Sitio multipágina, NO una SPA: un archivo que no existe debe responder
    # 404 de verdad (así los enlaces rotos se notan). Pero en vez de la página
    # fea de nginx, servimos el sitio — conservando el código 404.
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /index.html;

    # --- Cache --------------------------------------------------------------
    # Los HTML NO se cachean: así un redeploy se ve de inmediato en el
    # navegador del ciudadano, sin pedirle que limpie caché.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Los logos sí: cambian casi nunca y son la mayor parte del peso.
    location /assets/ {
        add_header Cache-Control "public, max-age=604800";  # 7 días
    }

    # --- Salud --------------------------------------------------------------
    # Para el healthcheck de Docker/Portainer. No aparece en los logs.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
